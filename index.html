    const g = { speed: 'pulley', throughput: 'pulley', duty: 'pulley', powerMargin: 'pulley', slip: 'tensions', shaftN: 'shaft' }[r.row.qty];
    if (g && hid(app, g)) return '?';
    return app.fmt(r.value) + (r.q.unit ? ' ' + r.q.unit : ' (no unit)') + (r.cmp === 'within' && isNum(r.diff) ? ' (' + U.fmtPct(r.diff, app.settings.sig) + ')' : '');
  }
  function reqStatus(app, r) {
    const g = { speed: 'pulley', throughput: 'pulley', duty: 'pulley', powerMargin: 'pulley', slip: 'tensions', shaftN: 'shaft' }[r.row.qty];
    if (g && hid(app, g) && (r.status === 'pass' || r.status === 'fail')) return '<span class="masked" aria-label="hidden until you check your prediction">?</span>';
    return STATUS[r.status];
  }
  function reqTable(app, forPrint) {
    if (!D.reqs.length) return '<p>No requirements entered.</p>';
    return '<table' + (forPrint ? '' : ' class="reqsum"') + '><tr class="hd"><th>ID</th><th>Requirement</th><th>Linked output</th><th>Design value</th><th>Status</th></tr>' +
      D.reqs.map(r => '<tr><td>R' + r.row.id + '</td><td>' + esc(reqText(app, r)) + '</td><td>' + esc(r.q.output) + '</td><td class="mono">' + esc(reqValue(app, r)) + '</td><td>' + (forPrint ? (r.status === 'undefined' ? 'not defined' : r.status) : reqStatus(app, r)) + '</td></tr>').join('') + '</table>';
  }

  /* ------------------------------------------------------------ right column */
  function results(app) {
    if (!D) return '<div class="sec-h">Design</div><p class="reason">' + esc(app.invalidReason()) + '.</p>';
    const fu = (v, u) => esc(app.fmtU(v, u)), dr = D.drive;
    let h = '<div class="sec-h">Design</div><table class="ro">';
    h += row('Belt pull T<sub>e</sub>', show(app, fu(D.pull.Te, 'N'), 'pull'));
    h += row('Belt / motor power (SF ' + esc(app.fmt(app.state.SF)) + ')', show(app, fu(D.power.P) + ' / ' + fu(D.power.Pmotor, 'W'), 'power'));
    h += row('Pulley torque / speed', show(app, fu(D.pulley.Tp, 'N·m') + ' / ' + fu(D.pulley.Np, 'rpm'), 'pulley'));
    h += row('Loaded belt speed', isNum(dr.vBelt) ? show(app, fu(dr.vBelt, 'm/s'), 'pulley') : reason(dr.reason || 'not defined'));
    h += row('T<sub>2,min</sub> / setting / T<sub>1</sub>', show(app, fu(D.tensions.T2min) + ' / ' + fu(D.tensions.T2) + ' / ' + fu(D.tensions.T1, 'N'), 'tensions'));
    h += row('Side load R / shaft n', show(app, fu(D.side.R, 'N') + ' / ' + esc(app.fmt(D.shaft.n)), 'shaft'));
    const pass = D.reqs.filter(r => r.status === 'pass').length, fail = D.reqs.filter(r => r.status === 'fail').length;
    h += row('Requirements', D.reqs.length ? pass + ' pass, ' + fail + ' fail' : 'none yet');
    h += '</table>';
    if (D.tensions.slips) h += '<p class="note warn">The belt will slip: the tension setting is below T<sub>2,min</sub>.</p>';
    h += '<div class="btnrow"><button class="btn" id="cdExpShaft" type="button">Export shaft loads</button><button class="btn" id="cdExpDrive" type="button">Send to Motor Matcher</button><button class="btn" id="cdExpGear" type="button">Build this in the Gear Train Workbench</button></div>';
    return h;
  }
  function download(app, kind, obj) {
    const name = U.exportName({ student: app.student(), tool: 'conveyor-designer', context: kind, dateISO: U.localDateISO(), ext: 'json' });
    app.download(name, JSON.stringify(obj, null, 2), 'application/json');
    return name;
  }

  /* ------------------------------------------------------------ design record */
  function recordPreview(app) {
    if (!D) return '';
    return '<div class="sec-h">Requirements</div>' + reqTable(app, false) +
      '<p class="note">The printed design record starts with this table, then the side view, all inputs and results with units, each design step\'s working in order, your prediction history and the sources. It is laid out for letter paper.</p>' +
      '<div class="btnrow"><button class="btn primary" id="cdPrint" type="button">Print the design record</button></div>';
  }

  /* ------------------------------------------------------------ help */
  const HELP = {
    html: '<p>Your capstone conveyor, one design step at a time, in the same order as the unit\'s design process. Every requirement shows pass or fail as the numbers change, and the design record is your team\'s calculation package.</p>' +
      '<h3>1. Requirements first</h3><p>On the Requirements tab, turn the brief into numbered, measurable requirements: a quantity, a check (target ± tolerance, at least, or at most) and a target. Custom rows (for example "guards on both nip points") are checked by hand.</p>' +
      '<h3>2. Design steps</h3><ol><li><strong>Belt pull</strong> for a slider bed: T<sub>e</sub> = μ g (m′<sub>b</sub> + m′<sub>p</sub>) L + m′<sub>p</sub> g H, with m′<sub>p</sub> = m<sub>box</sub> / s. It does not depend on speed. On an incline the friction term uses the full weight, which is on the safe side.</li>' +
      '<li><strong>Power</strong> P = T<sub>e</sub> v. Motor power needed = P × service factor ÷ η. Service factors: 1.5 normal, 2.0 heavy, 2.5 to 3.0 severe duty.</li>' +
      '<li><strong>Pulley</strong>: T<sub>p</sub> = T<sub>e</sub> D/2 and N<sub>p</sub> = 60 v / (π D), from v = ω r.</li>' +
      '<li><strong>Motor and ratio</strong>: the same model as the Motor and Drive Matcher. The ratio comes from the loaded speed, not the no-load speed, and the larger root keeps the motor cool. Or enter your own ratio and see the belt speed it gives.</li>' +
      '<li><strong>Tensions and slip</strong>: T<sub>1</sub> = T<sub>e</sub> + T<sub>2</sub>, and the belt slips if T<sub>1</sub>/T<sub>2</sub> > e<sup>μθ</sup> (θ in radians). So T<sub>2</sub> must be at least T<sub>e</sub> / (e<sup>μθ</sup> − 1). The default setting is 1.3 times that.</li>' +
      '<li><strong>Shaft and bearings</strong>: the two belt spans add as vectors to the side load R. With the pulley centred, M = R L<sub>b</sub>/4, and the shaft check is the Tresca check from the Shaft and Beam Workbench. Each bearing carries R/2.</li></ol>' +
      '<h3>Working with other tools</h3><p><strong>Export shaft loads</strong> saves the side load and torque for the Shaft and Beam Workbench. <strong>Send to Motor Matcher</strong> saves a drive request; the Motor and Drive Matcher\'s "Export drive result" file can then be loaded back here with Load, which sets the motor and your ratio. <strong>Build this in the Gear Train Workbench</strong> saves the same drive request; the Workbench reads it once its planned upgrade is done, so use the Motor and Drive Matcher until then.</p>' +
      '<h3>What industrial design adds</h3><p>Version 1 is a slider-bed conveyor carrying boxes. Industrial designs also handle roller beds and troughed bulk conveyors (the CEMA method), several drives, snub pulleys, start-up acceleration forces and belt selection by strength rating.</p>',
    units: 'Calculations use g = 9.81 m/s². The wrap angle is entered in degrees and turned into radians for e^(μθ).',
    keys: [['Tab', 'Move between inputs, steps and buttons'], ['Enter on a step heading', 'Open or close that step']],
    teacher: '<p>The yield strength starts at a placeholder 400 MPa, flagged in the readout until the team enters a datasheet value. The motor starts as the example motor from the Motor and Drive Matcher (2 N·m, 300 rpm).</p>' +
      '<p>Choices to review (QUESTIONS): motor power margin uses the motor\'s maximum power T<sub>s</sub>ω<sub>0</sub>/4 (Q19); one drive efficiency η is used for both the power and the gearbox (Q20); requirements have a check type (Q21); the shaft-loads export points the side load along the belt, toward the tail (Q22); throughput in the requirements uses the loaded belt speed (Q35).</p>' +
      '<p>CD-5 and CD-6 in the spec use rounded linked values (0.68 N·m, 95.5 rpm); with full precision the speed error shows −11.9% rather than −12.0% (ERRATA).</p>',
    sources: [
      { title: 'PackagingConveyor.com, conveyor engineering calculations', url: 'https://packagingconveyor.com/resources/conveyor-design-guide/conveyor-engineering/' },
      { title: 'Rulmeca, how to calculate conveyor belt tensions', url: 'https://www.rulmeca.blog/question-and-answer/how-to-calculate-conveyor-belt-tensions/' },
      { title: 'BisonConvey, capstan equation', url: 'https://bisonconvey.com/glossary/capstan-equation-eytelwein/' },
      { title: 'Wikipedia, capstan equation', url: 'https://en.wikipedia.org/wiki/Capstan_equation' },
      { title: 'Spec 01 (Shaft and Beam Workbench) and spec 02 (Motor and Drive Matcher) of this package, for the shaft and motor models' },
      { title: 'OpenStax University Physics Vol. 1, 10.8 (v = ω r, rpm to rad/s)', url: 'https://openstax.org/books/university-physics-volume-1/pages/10-8-work-and-power-for-rotational-motion' },
    ],
  };

  /* ------------------------------------------------------------ the tool */
  APP = Shell.create({
    tool: 'Conveyor Designer', repo: 'ConveyorDesigner', slug: 'conveyor-designer', version: VERSION, schemaVersion: 1,
    subtitle: 'Engineering education · Capstone drive design',
    defaultState: C.defaultState,
    tabs: { label: 'Views', options: [{ id: 'requirements', label: 'Requirements' }, { id: 'design', label: 'Design' }, { id: 'record', label: 'Design record' }], get: a => a.state.tab, set: (a, v) => { a.state.tab = v; } },
    help: HELP,
    imports: {
      'drive-result': (app, text) => {
        const res = Schemas.readDriveResult(text);
        const notes = C.applyDriveResult(app.state, res);
        app.refreshFields(); app.changed();
        app.toast('Loaded the drive result from the ' + (res.value.source || 'Motor and Drive Matcher') + ': motor ' + app.fmtU(app.state.Ts, 'N·m') + ', ' + app.fmtU(app.state.N0, 'rpm') + ', ratio ' + app.fmt(app.state.ratio) + '.' + (notes.concat(res.warnings).length ? ' ' + notes.concat(res.warnings).join(' ') : ''), 7000);
      },
    },
    afterLoad(app) {
      const s = app.state;
      if (['requirements', 'design', 'record'].indexOf(s.tab) < 0) s.tab = 'requirements';
      if (!Array.isArray(s.reqs)) s.reqs = [];
      s.nextReq = Math.max(s.nextReq || 1, ...s.reqs.map(r => r.id + 1), 1);
      if (s.ratioMode !== 'hand') s.ratioMode = 'solver';
      if ($('cdReqEd')) buildReqEditor(app);
    },
    build(app) {
      const I = app.el.inputs, F = C.FIELDS;
      const sec = html => { const d = document.createElement('div'); d.innerHTML = html; I.appendChild(d); return d; };
      const num = (parent, id, key, label, step, extra) => app.numField(parent, Object.assign({ id, key, label, step, get: a => a.state[key], set: (a, v) => { a.state[key] = v; } }, F[key], extra || {}));
      sec('<div class="sec-h">Requirements</div><div id="cdReqSide"></div>');
      const ld = sec('<div class="sec-h">Load</div>');
      num(ld, 'cdMBox', 'mBox', 'Box mass', 0.1); num(ld, 'cdS', 's', 'Box spacing s', 0.05); num(ld, 'cdV', 'v', 'Target belt speed v', 0.01);
      const bd = sec('<div class="sec-h">Bed</div>');
      num(bd, 'cdL', 'L', 'Bed length L', 0.1, { check: (v, a) => C.liftCheck(a.state.H, v) });
      num(bd, 'cdH', 'H', 'Lift H', 0.05, { check: (v, a) => C.liftCheck(v, a.state.L) });
      num(bd, 'cdMb', 'mb', 'Belt mass per meter m′<sub>b</sub>', 0.05); num(bd, 'cdMu', 'mu', 'Bed friction μ', 0.01);
      const pw = sec('<div class="sec-h">Power</div>');
      num(pw, 'cdSF', 'SF', 'Service factor', 0.1); num(pw, 'cdEta', 'eta', 'Drive efficiency η', 0.01);
      const pu = sec('<div class="sec-h">Drive pulley and motor</div>');
      num(pu, 'cdD', 'D', 'Pulley diameter D', 5);
      num(pu, 'cdTs', 'Ts', 'Motor stall torque T<sub>s</sub>', 0.1); num(pu, 'cdN0', 'N0', 'No-load speed N<sub>0</sub>', 10);
      app.selectField(pu, { id: 'cdRM', label: 'Ratio', options: [['solver', 'From the solver'], ['hand', 'My ratio']], get: a => a.state.ratioMode, set: (a, v) => { a.state.ratioMode = v; } });
      const rb = sec(''); rb.id = 'cdRatioBox'; pu.appendChild(rb);
      num(rb, 'cdRatio', 'ratio', 'Chosen ratio i', 0.01);
      const tb = sec('<div class="sec-h">Belt tension</div>');
      num(tb, 'cdMuP', 'muP', 'Pulley friction μ<sub>p</sub>', 0.01); num(tb, 'cdWrap', 'wrap', 'Wrap angle θ', 5);
      app.checkField(tb, { id: 'cdT2a', label: 'Set T₂ to 1.3 × T₂,min', get: a => a.state.T2auto, set: (a, v) => { a.state.T2auto = v; if (!v && D) a.state.T2 = Number(D.tensions.T2.toPrecision(3)); a.refreshFields(); } });
      const t2 = sec(''); t2.id = 'cdT2Box'; tb.appendChild(t2);
      num(t2, 'cdT2', 'T2', 'Your belt tension setting T<sub>2</sub>', 0.5);
      const shs = sec('<div class="sec-h">Pulley shaft</div>');
      num(shs, 'cdLb', 'Lb', 'Bearing span L<sub>b</sub>', 5); num(shs, 'cdDs', 'dShaft', 'Shaft diameter d', 0.5); num(shs, 'cdSy', 'Sy', 'Yield strength S<sub>y</sub>', 10);

      app.el.stage.innerHTML =
        '<div id="cdTabReq"><div class="sec-h">Requirements</div><div id="cdReqEd"></div><div class="btnrow"><button class="btn" id="cdAddReq" type="button">+ Add requirement</button><button class="btn" id="cdExReq" type="button">Add the example requirements</button></div></div>' +
        '<div id="cdNoReq" class="banner" hidden>No requirements yet. Start on the Requirements tab; the design still works without them.</div>' +
        '<div class="drawcard" id="cdDraw"></div>' +
        '<div id="cdTabDesign"><p class="strip" id="cdStrip"></p><div id="cdSteps"></div></div>' +
        '<div id="cdTabRec"></div>';
      $('cdAddReq').addEventListener('click', () => { const s = app.state; s.reqs.push({ id: s.nextReq++, desc: '', qty: 'speed', cmp: 'within', target: null, tol: 10 }); buildReqEditor(app); app.changed({ keepPrediction: true }); const ins = $('cdReqEd').querySelectorAll('input[data-f="desc"]'); if (ins.length) ins[ins.length - 1].focus(); });
      $('cdExReq').addEventListener('click', () => { const s = app.state; const ex = C.exampleRequirements(s.nextReq); s.reqs = s.reqs.concat(ex); s.nextReq += ex.length; buildReqEditor(app); app.changed({ keepPrediction: true }); app.announce('Added ' + ex.length + ' example requirements.'); });
      wireReqEditor(app); buildReqEditor(app);
      app.el.stage.addEventListener('click', e => {
        const g = e.target.closest('[data-goto]');
        if (g) { if (g.dataset.goto === 'req') { app.selectTab('requirements'); return; } const d = $('cdStep_' + g.dataset.goto); if (d) { d.open = true; d.scrollIntoView({ block: 'nearest' }); d.querySelector('summary').focus(); } return; }
        if (e.target.id === 'cdPrint') $('shReport').click();
      });
      app.el.results.addEventListener('click', e => {
        if (!D) return;
        if (e.target.id === 'cdExpShaft') { const n = download(app, 'shaft-loads', Schemas.makeShaftLoads('Conveyor Designer', [C.shaftLoads(D)], ['Drive pulley centred on a ' + app.fmtU(app.state.Lb, 'mm') + ' bearing span.'])); app.toast('Saved ' + n + '. Load it in the Shaft and Beam Workbench.'); }
        if (e.target.id === 'cdExpDrive' || e.target.id === 'cdExpGear') {
          const n = download(app, 'drive-request', Schemas.makeDriveRequest('Conveyor Designer', C.driveRequest(D, app.state)));
          app.toast(e.target.id === 'cdExpDrive' ? 'Saved ' + n + '. Load it in the Motor and Drive Matcher, then load its drive result back here.' : 'Saved ' + n + '. The Gear Train Workbench reads drive requests after its planned upgrade; until then, use the Motor and Drive Matcher.', 7000);
        }
      });
      window.__cd = { clock, design: () => D, phase: () => boxPhase };
    },
    render(app) {
      const s = app.state;
      app.fields.filter(x => x.o.id === 'cdL' || x.o.id === 'cdH').forEach(x => x.revalidate());
      D = app.hasInvalid() ? null : C.design(s);
      $('cdRatioBox').hidden = s.ratioMode !== 'hand';
      $('cdT2Box').hidden = s.T2auto;
      $('cdTabReq').hidden = s.tab !== 'requirements';
      $('cdTabDesign').hidden = s.tab !== 'design';
      $('cdTabRec').hidden = s.tab !== 'record';
      $('cdNoReq').hidden = !(s.tab === 'design' && !s.reqs.length);
      $('cdDraw').innerHTML = draw(app).svg;
      if (D) {
        renderSteps(app);
        D.reqs.forEach(r => { const v = $('cdRV' + r.row.id), st = $('cdRS' + r.row.id); if (v) v.textContent = reqValue(app, r); if (st) st.innerHTML = reqStatus(app, r); });
        $('cdReqSide').innerHTML = D.reqs.length ? '<table class="ro reqside">' + D.reqs.map(r => '<tr><th>R' + r.row.id + ' ' + esc(reqText(app, r)) + '</th><td>' + reqStatus(app, r) + '</td></tr>').join('') + '</table>' : '<p class="note">None yet.</p>';
        $('cdTabRec').innerHTML = recordPreview(app);
        if (isNum(D.drive.vBelt) && D.drive.vBelt > 0) { if (!clock.running) clock.start(); } else clock.stop();
      }
      app.el.results.innerHTML = results(app);
      const f = v => app.fmt(v), fu = (v, u) => app.fmtU(v, u);
      app.setWorking(D ? C.working(D, s, f, fu) : []);
      app.describe(D ? C.describe(D, s, fu, app.masked()) : 'The drawing cannot update until the highlighted input is fixed.');
    },
    drawing: (app, opts) => draw(app, opts),
    predictTargets: app => D ? C.targets(D) : [],
    inputsSnapshot: app => C.snapshot(app.state),
    report(app) {
      const s = app.state, fu = app.fmtU;
      const inputs = [
        ['Box mass, spacing', fu(s.mBox, 'kg') + ', ' + fu(s.s, 'm')], ['Target belt speed v', fu(s.v, 'm/s')], ['Bed length L, lift H', fu(s.L, 'm') + ', ' + fu(s.H, 'm')],
        ['Belt mass per meter', fu(s.mb, 'kg/m')], ['Bed friction μ', app.fmt(s.mu) + ' (no unit)'], ['Service factor, drive efficiency η', app.fmt(s.SF) + ', ' + app.fmt(s.eta) + ' (no unit)'],
        ['Pulley diameter D', fu(s.D, 'mm')], ['Motor stall torque, no-load speed', fu(s.Ts, 'N·m') + ', ' + fu(s.N0, 'rpm')],
        ['Ratio', s.ratioMode === 'solver' ? 'from the solver' : app.fmt(s.ratio) + ' (no unit)'], ['Pulley friction μp, wrap θ', app.fmt(s.muP) + ' (no unit), ' + fu(s.wrap, '°')],
        ['Belt tension setting', s.T2auto ? '1.3 × T₂,min' : fu(s.T2, 'N')], ['Bearing span, shaft d, Sy', fu(s.Lb, 'mm') + ', ' + fu(s.dShaft, 'mm') + ', ' + fu(s.Sy, 'MPa') + (s.Sy === 400 ? ' (placeholder value)' : '')],
      ];
      if (!D) return { inputs, outputs: [['Results', app.invalidReason()]] };
      const H = (v, g) => app.masked(g) ? 'hidden until checked' : v, dr = D.drive;
      const outputs = [
        ['Product mass per meter m′p', fu(D.load.mp, 'kg/m')], ['Throughput at the target speed', fu(D.load.throughput, 'boxes/min')],
        ['Belt pull Te (friction + lift)', H(fu(D.pull.Te, 'N') + ' (' + fu(D.pull.fric, 'N') + ' + ' + fu(D.pull.lift, 'N') + ')', 'pull')],
        ['Belt power P, motor power needed', H(fu(D.power.P, 'W') + ', ' + fu(D.power.Pmotor, 'W'), 'power')],
        ['Pulley torque Tp, speed Np', H(fu(D.pulley.Tp, 'N·m') + ', ' + fu(D.pulley.Np, 'rpm'), 'pulley')],
        ['Ratio used', dr.i === null ? 'none: ' + dr.reason : H(app.fmt(dr.i) + ' (no unit)', 'pulley')],
        ['Motor torque, % of stall, band', dr.op ? H(fu(dr.op.Tm, 'N·m') + ', ' + fu(dr.op.pct, '%') + ', ' + dr.op.band, 'pulley') : '—'],
        ['Loaded belt speed, error', isNum(dr.vBelt) ? H(fu(dr.vBelt, 'm/s') + ', ' + U.fmtPct(dr.speedErr, app.settings.sig), 'pulley') : '—'],
        ['Motor power margin', H(app.fmt(D.powerMargin) + ' (no unit)', 'pulley')],
        ['T₂,min, setting T₂, T₁', H(fu(D.tensions.T2min, 'N') + ', ' + fu(D.tensions.T2, 'N') + ', ' + fu(D.tensions.T1, 'N'), 'tensions')],
        ['Slip margin', H(app.fmt(D.tensions.margin) + ' (no unit)' + (D.tensions.slips ? ': the belt will slip' : ''), 'tensions')],
        ['Side load R, bearing loads', H(fu(D.side.R, 'N') + ', ' + fu(D.bearing, 'N') + ' each', 'shaft')],
        ['Shaft M, τmax, n', H(fu(D.shaft.M, 'N·m') + ', ' + fu(D.shaft.tauMax / 1e6, 'MPa') + ', ' + app.fmt(D.shaft.n) + ' (no unit)', 'shaft')],
      ];
      if (D.hold) outputs.push(['Incline: backward pull with power off', H(fu(D.hold.backward, 'N'), 'pull')]);
      return { lead: [{ title: 'Requirements', html: reqTable(app, true) }], inputs, outputs };
    },
  });
})();
</script>
</body>
</html>
