<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Conveyor Designer: the capstone design tool. Turn a brief into requirements, then size the belt pull, power, pulley, motor and ratio, belt tensions and pulley shaft, with every requirement checked as you go. Engineered by the Numbers.">
<title>Conveyor Designer</title>
<link rel="icon" href="data:,">
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('ebtn-theme') || 'null');
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<style>
/* BEGIN vendor:shell.css */
/* ecosystem/shell/shell.css v1.0.0
   Shared look for the Engineered by the Numbers tools. Palette and header,
   readout and footer patterns follow the Gear Train Workbench. Light theme is
   "drafting paper"; data-theme="dark" is "blueprint". Every colour a tool
   draws should come from these tokens (read them with app.pal()). */
:root, :root[data-theme="light"]{
  --paper:#F6F5F0; --grid-minor:#E7E5DC; --grid-major:#D8D5C8;
  --ink:#23272C; --ink-soft:#555B63; --line:#C9C6BA;
  --steel:#DCE1E6; --steel-edge:#7E8892;
  --dykem:#1D5FA8; --dykem-soft:#E3ECF7;
  --brass:#B08A2E; --brass-soft:#F5EBD2; --brass-ink:#7A5A16;
  --pass:#2E7D46; --fail:#B3402F; --warn:#8A5A00;
  --pos-fill:#DCE6F5; --neg-fill:#F6DDD8;
  --dro-bg:#1D2126; --dro-amber:#FFB000; --dro-label:#8B929B;
  --panel:#F1EFE8; --field:#ffffff; --rule:#B9B6AA; --th-bg:#EDEBE2;
  --scrim:rgba(35,39,44,.5); --badge-text:#ffffff;
  --font-ui:"Avenir Next","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0C2B4E; --grid-minor:#123659; --grid-major:#1A4771;
  --ink:#EAF2FB; --ink-soft:#A8C2DC; --line:#1E5183;
  --steel:#5E86AB; --steel-edge:#E4EFFA;
  --dykem:#5FD0E8; --dykem-soft:#123659;
  --brass:#FFC94D; --brass-soft:#2A2410; --brass-ink:#FFC94D;
  --pass:#57D493; --fail:#FF8A73; --warn:#FFC94D;
  --pos-fill:#1D4D7A; --neg-fill:#5A2E3A;
  --dro-bg:#071B31; --dro-amber:#FFC94D; --dro-label:#A8C2DC;
  --panel:#0F3157; --field:#123659; --rule:#1E5183; --th-bg:#123659;
  --scrim:rgba(3,15,28,.65); --badge-text:#08243F;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--dykem)}

/* ---------- Header / title block ---------- */
.sh-header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:2px solid var(--ink);background:var(--paper);flex-wrap:wrap}
.titleblock{display:flex;flex-direction:column;line-height:1.15}
.titleblock .t1{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.titleblock .t2{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.modes button{font:600 12.5px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;padding:6px 11px;border:none;background:transparent;color:var(--ink);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.tabs [role="tab"]{font:600 12.5px var(--font-ui);letter-spacing:.05em;padding:6px 11px;border:none;border-right:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tabs [role="tab"]:last-child{border-right:none}
.tabs [role="tab"][aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs [role="tab"]:focus-visible{outline-offset:-4px;outline-color:var(--brass)}
.chwrap{display:flex;align-items:center;gap:6px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.chwrap[hidden],.namewrap[hidden],.hbtns button[hidden]{display:none}
.chwrap select{font:13px var(--font-ui);border:1.5px solid var(--ink);border-radius:3px;background:var(--field);color:var(--ink);padding:3px 4px;max-width:260px;text-transform:none;letter-spacing:0}
.sh-brief{padding:6px 14px;background:var(--panel);border-bottom:1.5px solid var(--line);font-size:13.5px;line-height:1.45}
.sh-brief[hidden]{display:none}
.sh-brief .note{color:var(--ink-soft);margin-left:6px}
.spacer{flex:1}
.namewrap{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.namewrap input{font:15px var(--font-ui);border:none;border-bottom:1.5px solid var(--ink);background:transparent;padding:3px 4px;width:118px;color:var(--ink)}
.hbtns{display:flex;gap:5px;flex-wrap:wrap}
.hbtns button{font:600 12.5px var(--font-ui);letter-spacing:.02em;padding:6px 8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:3px;cursor:pointer}
.hbtns button:hover{background:var(--ink);color:var(--paper)}
.hbtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Small-screen notice ---------- */
.sh-small{display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--brass-soft);color:var(--ink);border-bottom:1.5px solid var(--brass);font-size:13px}
.sh-small button{margin-left:auto;border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:2px 8px;cursor:pointer}
@media (max-width:767.98px){ .sh-small:not([hidden]){display:flex} }

/* ---------- Main three-column layout ---------- */
.sh-main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 350px;min-height:0}
.sh-col{overflow-y:auto;min-height:0}
.sh-inputs{background:var(--panel);border-right:1.5px solid var(--line);padding:10px 12px 18px}
.sh-results{background:var(--panel);border-left:1.5px solid var(--line);padding:10px 12px 18px}
.sh-stage{padding:12px 14px;background-color:var(--paper);
  background-image:linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:20px 20px}
@media (max-width:1180px){ .sh-main{grid-template-columns:270px minmax(0,1fr) 310px} }
@media (max-width:1023.98px){
  body{overflow:auto}
  .sh-main{grid-template-columns:1fr;min-height:auto}
  .sh-col{overflow:visible}
  .sh-inputs,.sh-results{border:none;border-top:1.5px solid var(--line)}
  .sh-stage{order:-1}
}

/* ---------- Input panel ---------- */
.sec-h{font:700 12px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec-h:first-child{margin-top:2px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) minmax(108px,auto);align-items:center;gap:4px 8px;margin:5px 0}
.fld>label,.fld>.lbl{font-size:13.5px;line-height:1.25}
.fld .ctl{display:flex;align-items:center;gap:4px}
.fld input[type=text],.fld select,.fld input[type=number]{width:80px;min-width:0;font:14px var(--font-mono);padding:4px 6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);text-align:right}
.fld select{text-align:left;font-family:var(--font-ui);font-size:13.5px;width:auto;max-width:176px}
.fld .unit{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.fld input[aria-invalid="true"]{border-color:var(--fail);border-width:2px}
.fld .err{grid-column:1/-1;font-size:12.5px;line-height:1.35;color:var(--fail);font-weight:600}
.fld .err:empty{display:none}
.fld .err::before{content:"⚠ "}
.fld.wide{grid-template-columns:1fr}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin:6px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--dykem)}
.note{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin:6px 0}
.note.warn{color:var(--warn);font-weight:600}
.note.warn::before{content:"⚠ "}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{font:600 13px var(--font-ui);letter-spacing:.03em;padding:6px 10px;border:1.5px solid var(--ink);background:var(--field);color:var(--ink);border-radius:3px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--dykem);border-color:var(--dykem);color:var(--badge-text)}
.btn.small{padding:3px 7px;font-size:12px}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn.danger:hover{background:var(--fail);color:var(--badge-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{font:600 12.5px var(--font-ui);padding:4px 10px;border:none;background:var(--field);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.itemcard{border:1.5px solid var(--line);border-radius:4px;background:var(--field);padding:6px 8px;margin:6px 0}
.itemcard.sel{border-color:var(--dykem);box-shadow:0 0 0 1px var(--dykem)}
.itemcard .ih{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.itemcard .ih input{flex:1;min-width:0;font:600 13px var(--font-ui);border:none;border-bottom:1px dashed var(--line);background:transparent;padding:1px 2px}

/* ---------- Stage (drawing) ---------- */
.drawcard{background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;position:relative}
.drawcard svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.drawcard svg:focus-visible{outline:3px solid var(--dykem);outline-offset:-3px}
.cap{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin-top:6px}
.stationro{margin-top:8px;font:13px var(--font-mono);background:var(--field);border:1.5px solid var(--line);border-radius:3px;padding:6px 9px;min-height:2.2em}

/* ---------- Results ---------- */
.ro{width:100%;border-collapse:collapse;font-size:13.5px}
.ro th{text-align:left;font-weight:400;padding:4px 4px 4px 0;border-bottom:1px dotted var(--line);vertical-align:top}
.ro td{text-align:right;font:700 14px var(--font-mono);padding:4px 0;border-bottom:1px dotted var(--line);white-space:nowrap}
.ro td.wrap{white-space:normal}
.ro tr.sub th{padding-left:12px;color:var(--ink-soft)}
.masked{display:inline-block;min-width:3.2em;text-align:center;border:1.5px dashed var(--ink-soft);border-radius:3px;color:var(--ink-soft);font-weight:400}
.verdict{font-weight:700}
.verdict.pass{color:var(--pass)}
.verdict.fail{color:var(--fail)}
.verdict.pass::before{content:"✓ "}
.verdict.fail::before{content:"✗ "}
.verdict.info{color:var(--warn)}
.verdict.info::before{content:"● "}
.reason{font:italic 13px var(--font-ui);color:var(--ink-soft);white-space:normal}

/* ---------- Predict first ---------- */
.pfbox{margin-top:12px;border:1.5px solid var(--ink);border-left-width:5px;border-radius:3px;background:var(--field);padding:9px 10px}
.pfbox h3{font:700 12px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.pfrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:6px;align-items:center;margin:5px 0;font-size:13.5px}
.pfrow input{font:14px var(--font-mono);padding:4px 6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);text-align:right;width:100%}
.pfrow .unit{font-size:12px;color:var(--ink-soft)}
.pfrow select{font:13.5px var(--font-ui);padding:3px 4px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);width:100%}
.pfgroup{border-top:1px dotted var(--line);padding-top:6px;margin-top:6px}
.pfgroup h4{font:700 11.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.pfmsg{font-size:13px;line-height:1.45;margin:5px 0;padding:5px 7px;border-left:3px solid var(--line);background:var(--panel)}
.pfmsg.match{border-left-color:var(--pass)}
.pfmsg.close{border-left-color:var(--brass)}
.pfmsg b{font-family:var(--font-mono)}
.pftag{font:700 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;margin-left:4px}
.pftag.match{background:var(--pass);color:var(--badge-text)}
.pftag.close{background:var(--brass-ink);color:var(--badge-text)}

/* ---------- Show the working ---------- */
.working{margin-top:12px;border:1.5px solid var(--line);border-radius:3px;background:var(--field)}
.working>summary{cursor:pointer;padding:7px 10px;font:700 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.working[open]>summary{color:var(--ink);border-bottom:1px solid var(--line)}
.wk{list-style:none;padding:6px 10px 8px;counter-reset:wk}
.wk li{counter-increment:wk;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13px;line-height:1.5}
.wk li:last-child{border-bottom:none}
.wk .wt{font-weight:700}
.wk .wt::before{content:counter(wk) ". "}
.wk .wf,.wk .ws{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.wk .wr{font-family:var(--font-mono);font-weight:700}
.wk .wsrc{font-size:11.5px;color:var(--ink-soft);font-style:italic}
.wk-h{font:700 11.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 0;color:var(--ink)}
.sh-dlg textarea{width:100%;font:12.5px var(--font-mono);border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);padding:6px}

/* ---------- Dialogs ---------- */
dialog.sh-dlg{margin:auto;border:2px solid var(--ink);border-radius:5px;background:var(--paper);color:var(--ink);max-width:min(760px,94vw);width:100%;max-height:86vh;padding:0}
dialog.sh-dlg::backdrop{background:var(--scrim)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--paper)}
.dlg-h h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dlg-b{padding:14px 18px 18px;overflow-y:auto}
.dlg-b h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
.dlg-b p,.dlg-b li{font-size:14.5px;line-height:1.6;margin-bottom:7px}
.dlg-b ul,.dlg-b ol{padding-left:22px;margin-bottom:8px}
.dlg-b table{border-collapse:collapse;font-size:13px;width:100%}
.dlg-b th,.dlg-b td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.dlg-b th{background:var(--th-bg);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.dlg-b td input{width:100%;min-width:60px;font:13px var(--font-mono);padding:2px 4px;border:1px solid var(--steel-edge);border-radius:2px;background:var(--field);color:var(--ink)}
.dlg-b textarea{width:100%;font:12.5px var(--font-mono);padding:6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink)}
.teacher{margin-top:18px;padding:10px 12px;border:1.5px dashed var(--ink-soft);border-radius:3px}
kbd{font:12px var(--font-mono);border:1px solid var(--steel-edge);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--field)}

/* ---------- Toast ---------- */
.sh-toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:14px var(--font-ui);padding:8px 16px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;z-index:60}
.sh-toast.on{opacity:1}

/* ---------- Footer (attribution block, identical across tools) ---------- */
.sh-footer{flex:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;padding:6px 14px;border-top:1.5px solid var(--line);background:var(--panel);font-size:12px;color:var(--ink-soft)}
.sh-footer .foot-by{color:var(--ink)}
.sh-footer a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line)}
.sh-footer a:hover{color:var(--dykem);text-decoration-color:var(--dykem)}
.sh-footer .foot-by a{color:var(--ink)}
.sh-footer .foot-spacer{flex:1}
.sh-footer .foot-ai{width:100%;order:10}

/* ---------- Accessibility ---------- */
:focus-visible{outline:2px solid var(--dykem);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------- Print report (always ink on paper) ---------- */
#sh-report{display:none}
@media print{
  @page{size:letter;margin:12mm}
  body>*:not(#sh-report){display:none !important}
  body{overflow:visible;height:auto;display:block;background:#fff;color:#000}
  #sh-report{display:block !important;font-family:var(--font-ui);color:#000;font-size:11.5px}
  #sh-report .rb{border:2px solid #000;padding:12px 16px;margin-bottom:10px}
  #sh-report h1{font-size:17px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
  #sh-report h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 4px;break-after:avoid}
  #sh-report .sub{font-size:11px;letter-spacing:.06em;color:#444;margin-bottom:8px}
  #sh-report table{width:100%;border-collapse:collapse;font-size:11px;margin:4px 0 8px;break-inside:auto}
  #sh-report tr{break-inside:avoid}
  #sh-report th,#sh-report td{border:1px solid #000;padding:3px 6px;text-align:left;vertical-align:top}
  #sh-report th{background:#eee;font-size:10.5px;font-weight:700}
  #sh-report tr.hd th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
  #sh-report .fig{border:1px solid #000;break-inside:avoid}
  #sh-report .fig svg{width:100%;height:auto;display:block}
  #sh-report .mono{font-family:var(--font-mono)}
  #sh-report h3.wk-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 2px;padding:0}
  #sh-report .sig{margin-top:18px;font-size:11px}
  #sh-report .sig span{display:inline-block;border-top:1px solid #000;min-width:200px;padding-top:3px;margin-right:36px}
}
/* END vendor:shell.css */

/* ---------- Conveyor Designer ---------- */
.banner{border:1.5px solid var(--brass);background:var(--brass-soft);border-radius:3px;padding:7px 10px;font-size:13px;margin-bottom:8px}
.banner[hidden]{display:none}
.strip{font-size:13px;margin:8px 0;line-height:1.9}
.strip .lbl{color:var(--ink-soft)}
.strip .link{font:600 13px var(--font-ui);border:none;background:none;color:var(--dykem);cursor:pointer;padding:2px 3px;text-decoration:underline}
details.step{border:1.5px solid var(--line);border-radius:3px;background:var(--field);margin:6px 0}
details.step>summary{cursor:pointer;padding:7px 10px;font:700 13px var(--font-ui)}
details.step>summary .num{display:inline-block;min-width:18px;text-align:center;background:var(--ink);color:var(--paper);border-radius:2px;margin-right:4px}
details.step .stepb{padding:2px 12px 10px}
.mplot svg{width:100%;max-width:330px;height:auto;display:block}
.ok{color:var(--pass);font-weight:700}
.bad{color:var(--fail);font-weight:700}
.man{color:var(--ink-soft);font-weight:700}
.small{font:400 11.5px var(--font-ui);color:var(--ink-soft)}
table.reqed{width:100%;border-collapse:collapse;font-size:12.5px}
table.reqed th{font:700 11px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:3px 4px;border-bottom:1.5px solid var(--line)}
table.reqed td{padding:3px 4px;border-bottom:1px dotted var(--line);vertical-align:middle}
table.reqed input,table.reqed select{font:12.5px var(--font-ui);border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);padding:3px 4px;width:100%;min-width:0}
table.reqed input.num{font-family:var(--font-mono);text-align:right;width:62px}
table.reqed input[aria-invalid="true"]{border-color:var(--fail)}

      const o = cfg.tabs.options.find(x => x.id === id);
      if (!o) return;
      cfg.tabs.set(app, id);
      saveState(); render();
      app.announce(o.label + ' tab.');
    };
    function syncTabs() {
      if (!cfg.tabs) return;
      const cur = app.tab();
      document.querySelectorAll('#shTabs [role="tab"]').forEach(b => {
        const on = b.dataset.tab === cur;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.setAttribute('tabindex', on ? '0' : '-1');
      });
      document.body.setAttribute('data-tab', cur || '');
    }

    /* ---------------- challenges (00 §4.5–4.6) ---------------- */
    // cfg.challenges: { builtIn: [...] (examples), active(app) -> challenge mode on?,
    // apply(app, challenge) (default: copy challenge.inputs into app.state) }.
    // A teacher's list, pasted in Settings, replaces the built-in examples.
    const CH = cfg.challenges || null;
    const builtInChallenges = () => {
      if (!CH || !CH.builtIn) return [];
      try { return readChallengeList(CH.builtIn, cfg.tool).value.challenges; } catch (e) { console.error('Built-in challenges are not valid: ' + e.message); return []; }
    };
    app.challengeList = () => {
      const t = CH ? S.get('challenges', null) : null;
      if (t) { try { return readChallengeList(t, cfg.tool).value.challenges; } catch (e) { /* fall back to the examples */ } }
      return builtInChallenges();
    };
    app.isChallengeMode = () => !!CH && (CH.active ? !!CH.active(app) : !!(cfg.modes && cfg.modes.get(app) === 'challenge'));
    app.challenge = () => {
      if (!app.isChallengeMode() || !app.settings.challengeId) return null;
      return app.challengeList().find(c => c.id === app.settings.challengeId) || null;
    };
    app.isHidden = key => { const c = app.challenge(); return !!(c && c.hidden.indexOf(key) >= 0); };
    app.startChallenge = id => {
      const c = app.challengeList().find(x => x.id === id) || null;
      app.settings.challengeId = c ? c.id : null;
      if (c) {
        if (c.predictFirst || c.requirePrediction) app.settings.predictFirst = true;
        if (CH.apply) CH.apply(app, c);
        else for (const k in c.inputs) if (Object.prototype.hasOwnProperty.call(app.state, k)) app.state[k] = c.inputs[k];
      }
      saveSettings(); app.invalid = {};
      clearPrediction(); app.refreshFields(); saveState(); render();
      app.announce(c ? 'Challenge ' + c.id + ': ' + c.title + '.' : 'No challenge chosen.');
    };
    // 00 §4.6: a challenge can require a checked prediction before Run (or Spin up, Turn ...).
    app.gate = () => {
      const c = app.challenge();
      if (!c || !c.requirePrediction || (pfOn() && app.pf.revealed)) return true;
      app.toast('Check your prediction first.'); app.announce('Check your prediction first.');
      return false;
    };
    if (CH) $('shChallenge').addEventListener('change', e => app.startChallenge(e.target.value));
    function syncChallenge() {
      if (!CH) return;
      const on = app.isChallengeMode(), list = app.challengeList(), c = app.challenge();
      $('shChWrap').hidden = !on;
      const sel = $('shChallenge');
      const html = '<option value="">Choose a challenge</option>' + list.map(x => '<option value="' + esc(x.id) + '">' + esc(x.id + ' · ' + x.title) + (x.example ? ' (example)' : '') + '</option>').join('');
      if (sel.innerHTML !== html) sel.innerHTML = html;
      sel.value = c ? c.id : '';
      brief.hidden = !(on && c);
      if (on && c) {
        const bh = '<strong>' + esc(c.id + ' · ' + c.title) + '</strong>' + (c.brief ? ' ' + esc(c.brief) : '') +
          (c.hidden.length ? ' <span class="note">Some values are hidden for this challenge.</span>' : '') +
          (c.requirePrediction ? ' <span class="note">Check a prediction before you run it.</span>' : '');
        if (brief.innerHTML !== bh) brief.innerHTML = bh;
      }
    }

    /* =================================================================
       FIELDS
       ================================================================= */
    // Numeric input row. o: { id, label, unit, name, get(app), set(app, v), min, max, gt, integer,
    // check(v, app), step, help, parent, key }. `key` names the value for challenges: a
    // challenge that hides that key shows "hidden" in a locked box.
    app.numField = (parent, o) => {
      const row = h('div', { class: 'fld' });
      const errId = o.id + 'Err';
      row.innerHTML = '<label for="' + o.id + '">' + o.label + '</label>' +
        '<span class="ctl"><input type="text" inputmode="decimal" id="' + o.id + '" aria-describedby="' + errId + '" autocomplete="off">' +
        (o.unit ? '<span class="unit">' + esc(o.unit) + '</span>' : '') + '</span>' +
        '<div class="err" id="' + errId + '" role="alert"></div>';
      const input = row.querySelector('input'), err = row.querySelector('.err');
      const spec = () => ({ name: o.name || o.label.replace(/<[^>]+>/g, ''), unit: o.unit, min: typeof o.min === 'function' ? o.min(app) : o.min, max: typeof o.max === 'function' ? o.max(app) : o.max, gt: o.gt, integer: o.integer, check: o.check ? v => o.check(v, app) : null });
      function commit() {
        const r = validateNumber(input.value, spec());
        if (r.error) {
          err.textContent = r.error; input.setAttribute('aria-invalid', 'true'); app.invalid[o.id] = r.error;
        } else {
          err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id];
          o.set(app, r.value);
        }
        app.changed();
      }
      input.addEventListener('input', commit);
      input.addEventListener('keydown', e => {
        if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && o.step) {
          e.preventDefault();
          const cur = parseNumber(input.value);
          const base = isNum(cur) ? cur : o.get(app);
          const d = (e.key === 'ArrowUp' ? 1 : -1) * o.step * (e.shiftKey ? 10 : 1);
          input.value = fmtInput(Number((base + d).toFixed(10)));
          commit();
        }
      });
      const hid = () => !!(o.key && app.isHidden(o.key));
      // Returns true when the box is showing "hidden" and must not be refreshed.
      const lockHidden = () => {
        if (hid()) { input.disabled = true; input.value = 'hidden'; err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id]; return true; }
        if (input.disabled && input.value === 'hidden') { input.disabled = false; input.value = fmtInput(o.get(app)); }
        return false;
      };
      const field = {
        o, input, err, row,
        sync() {
          if (lockHidden()) return;
          if (document.activeElement === input || app.invalid[o.id]) return;
          const v = o.get(app); const s = fmtInput(v);
          if (input.value !== s && parseNumber(input.value) !== v) input.value = s;
          else if (input.value === '' && s !== '') input.value = s;
        },
        revalidate() { if (!hid() && input.value !== '') { const r = validateNumber(input.value, spec()); if (r.error && !app.invalid[o.id]) { err.textContent = r.error; input.setAttribute('aria-invalid', 'true'); app.invalid[o.id] = r.error; } else if (!r.error && app.invalid[o.id]) { err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id]; o.set(app, r.value); } } },
        reset() { if (lockHidden()) return; err.textContent = ''; input.removeAttribute('aria-invalid'); delete app.invalid[o.id]; input.value = fmtInput(o.get(app)); },
      };
      input.value = fmtInput(o.get(app));
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    // Select row. o: { id, label, options: [[value, label]] or fn(app), get, set }
    app.selectField = (parent, o) => {
      const row = h('div', { class: 'fld' });
      row.innerHTML = '<label for="' + o.id + '">' + o.label + '</label><span class="ctl"><select id="' + o.id + '"></select></span>';
      const sel = row.querySelector('select');
      const fill = () => {
        const opts = typeof o.options === 'function' ? o.options(app) : o.options;
        const html = opts.map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('');
        if (sel.innerHTML !== html) sel.innerHTML = html;
        sel.value = String(o.get(app));
      };
      fill();
      sel.addEventListener('change', () => { o.set(app, sel.value); app.changed(); });
      const field = { o, input: sel, row, sync: fill, reset: fill, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.checkField = (parent, o) => {
      const row = h('label', { class: 'chk' }, '<input type="checkbox" id="' + o.id + '"> ' + o.label);
      const cb = row.querySelector('input');
      cb.checked = !!o.get(app);
      cb.addEventListener('change', () => { o.set(app, cb.checked); app.changed(); });
      const field = { o, input: cb, row, sync() { cb.checked = !!o.get(app); }, reset() { cb.checked = !!o.get(app); }, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.removeFields = container => { app.fields = app.fields.filter(f => { if (container.contains(f.row)) { delete app.invalid[f.o.id]; return false; } return true; }); };
    app.hasInvalid = () => Object.keys(app.invalid).length > 0;
    app.invalidReason = () => 'not defined: fix the highlighted input' + (Object.keys(app.invalid).length > 1 ? 's' : '');

    /* =================================================================
       PREDICT FIRST (00 §4)
       ================================================================= */
    const pfOn = () => !!app.settings.predictFirst;
    // Predict targets can carry a `group` (and `groupLabel`). Each group has its own
    // Check, so a team can predict one design step before seeing the next. A tool with
    // no groups behaves as one group named ''.
    const groupsOf = targets => {
      const gs = [];
      targets.forEach(t => { const g = t.group || ''; if (gs.indexOf(g) < 0) gs.push(g); });
      return gs.length ? gs : [''];
    };
    const grp = g => { g = g || ''; return app.pf.groups[g] || (app.pf.groups[g] = { revealed: false, messages: [] }); };
    // masked(): true while any group is still hidden. masked(group): that group only.
    app.masked = g => {
      if (!pfOn()) return false;
      if (g !== undefined) return !grp(g).revealed;
      return !app.pf.revealed;
    };
    // Wrap a readout value: shows a blank box while hidden.
    app.show = (text, g) => app.masked(g) ? '<span class="masked" aria-label="hidden until you check your prediction">?</span>' : text;
    function clearPrediction() { app.pf.revealed = false; app.pf.groups = {}; app.pf.fields = {}; app.pf.messages = []; }
    $('shPredict').addEventListener('click', () => {
      const c = app.challenge();
      if (c && c.requirePrediction && pfOn()) { app.toast('This challenge needs predict first.'); return; }
      app.settings.predictFirst = !pfOn(); saveSettings(); clearPrediction(); render();
      app.announce(pfOn() ? 'Predict first is on. Results are hidden until you check a prediction.' : 'Predict first is off.');
    });
    function problemId() {
      if (cfg.problemId) return cfg.problemId(app);
      const c = app.challenge();
      return c ? c.id : PL.sandboxProblemId(snapshot().values);
    }
    function snapshot() { return cfg.inputsSnapshot ? cfg.inputsSnapshot(app) : { values: {}, units: {} }; }
    const tolerance = () => { const c = app.challenge(); return (c && c.tolerance) || cfg.tolerance; };
    const gid = g => g ? '_' + String(g).replace(/[^A-Za-z0-9_-]/g, '-') : '';
    function renderPf() {
      const box = app.el.pf;
      $('shPredict').setAttribute('aria-pressed', pfOn() ? 'true' : 'false');
      if (!pfOn()) { box.hidden = true; return; }
      box.hidden = false;
      const targets = cfg.predictTargets(app);
      const gs = groupsOf(targets), multi = gs.length > 1;
      const blocked = app.hasInvalid();
      let html = '<h3>Predict first</h3>';
      if (gs.some(g => !grp(g).revealed)) html += '<p class="note">Enter your predictions, then press Check. Results stay hidden until you do.</p>';
      gs.forEach(g => {
        const ts = targets.filter(t => (t.group || '') === g), st = grp(g), sfx = gid(g);
        if (multi) html += '<div class="pfgroup" data-group="' + esc(g) + '"><h4>' + (ts[0] && ts[0].groupLabel ? ts[0].groupLabel : esc(g)) + '</h4>';
        if (!st.revealed) {
          ts.forEach(t => {
            const id = 'shPf_' + t.key, cur = app.pf.fields[t.key] || '';
            const ctl = t.kind === 'yesno'
              ? '<select id="' + id + '" data-key="' + esc(t.key) + '" data-group="' + esc(g) + '"><option value=""' + (cur === '' ? ' selected' : '') + '>—</option><option value="1"' + (cur === '1' ? ' selected' : '') + '>Yes</option><option value="0"' + (cur === '0' ? ' selected' : '') + '>No</option></select><span class="unit"></span>'
              : '<input type="text" inputmode="decimal" id="' + id + '" data-key="' + esc(t.key) + '" data-group="' + esc(g) + '" value="' + esc(cur) + '" autocomplete="off"><span class="unit">' + esc(t.unit || '') + '</span>';
            html += '<div class="pfrow"><label for="' + id + '">' + t.label + '</label>' + ctl + '</div>';
          });
          html += '<div class="btnrow"><button class="btn primary" id="shCheck' + sfx + '" data-check="' + esc(g) + '" type="button"' + (blocked ? ' disabled' : '') + '>Check</button></div>';
        } else {
          st.messages.forEach(m => { html += '<div class="pfmsg ' + (m.verdict || '') + '">' + m.html + '</div>'; });
          html += '<div class="btnrow"><button class="btn" id="shAgain' + sfx + '" data-again="' + esc(g) + '" type="button">Predict again</button></div>';
        }
        if (multi) html += '</div>';
      });
      if (blocked && gs.some(g => !grp(g).revealed)) html += '<p class="note warn">Fix the highlighted input before checking.</p>';
      box.innerHTML = html;
      box.querySelectorAll('[data-key]').forEach(inp => inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => { app.pf.fields[inp.dataset.key] = inp.value; }));
      // preventDefault: Check moves focus to "Predict again", and without it the same Enter
      // press would go on to activate that button and undo the Check at once.
      box.querySelectorAll('[data-key]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(inp.dataset.group); } }));
      box.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', () => check(b.dataset.check)));
      box.querySelectorAll('[data-again]').forEach(b => b.addEventListener('click', () => {
        const g = b.dataset.again, st = grp(g);
        st.revealed = false; st.messages = []; app.pf.revealed = false;
        cfg.predictTargets(app).filter(t => (t.group || '') === g).forEach(t => { delete app.pf.fields[t.key]; });
        render();
        const f = box.querySelector('[data-key][data-group="' + (window.CSS && CSS.escape ? CSS.escape(g) : g) + '"]'); if (f) f.focus();
      }));
    }
    function check(g) {
      g = g || '';
      if (app.hasInvalid()) return;
      const all = cfg.predictTargets(app);
      const targets = all.filter(t => (t.group || '') === g);
      const student = app.student() || 'unnamed';
      const pid = problemId(), snap = snapshot();
      const msgs = [], recs = [];
      for (const t of targets) {
        const raw = app.pf.fields[t.key];
        if (raw === undefined || String(raw).trim() === '') continue;
        const p = parseNumber(raw);
        if (!isNum(p)) { app.toast(t.label.replace(/<[^>]+>/g, '') + ': enter a number.'); document.getElementById('shPf_' + t.key).focus(); return; }
        const yn = t.kind === 'yesno';
        if (yn && p !== 0 && p !== 1) { app.toast(t.label.replace(/<[^>]+>/g, '') + ': choose yes or no.'); return; }
        const model = isNum(t.model) ? t.model : null;
        const rec = PL.makeRecord({
          tool: cfg.tool, toolVersion: cfg.version, student, team: app.settings.team, classPeriod: app.settings.classPeriod,
          problemId: pid, quantity: t.quantity || t.key, unit: yn ? 'yes/no' : t.unit || '', predicted: p, model, measured: t.measured,
          attempt: PL.nextAttempt(app.log, student, pid, t.quantity || t.key), inputs: snap,
        });
        recs.push(rec);
        const v = yn ? (model === p ? 'match' : 'off') : verdictFor(rec.pctPredVsModel, tolerance());
        const tag = v === 'match' ? ' <span class="pftag match">Match</span>' : v === 'close' ? ' <span class="pftag close">Close</span>' : '';
        msgs.push({ verdict: v === 'match' ? 'match' : v === 'close' ? 'close' : '', html: '<b>' + t.label + '</b>' + tag + '<br>' + esc(yn ? yesNoMessage(p, model, t.reason) : predictionMessage(p, model, t.unit, app.settings.sig, t.reason)) });
      }
      if (!recs.length) msgs.push({ html: 'No prediction was entered, so nothing was logged. The results are shown below.' });
      app.log = app.log.concat(recs); saveLog();
      const st = grp(g);
      st.revealed = true; st.messages = msgs;
      app.pf.messages = msgs;
      app.pf.revealed = groupsOf(all).every(x => grp(x).revealed);
      render();
      app.announce(msgs.map(m => m.html.replace(/<[^>]+>/g, ' ')).join(' '));
      const again = $('shAgain' + gid(g)); if (again) again.focus();
    }
    app.check = check;
    // Attach a measured value to this student's latest prediction of a quantity for the
    // current inputs (a target's `quantity`). Returns the updated record, or null when
    // there is no such prediction yet. A target can also carry `measured` at Check.
    app.recordMeasured = (quantity, measured) => {
      const res = PL.annotateLatest(app.log, { student: app.student() || 'unnamed', problemId: problemId(), quantity, tool: cfg.tool }, { measured });
      if (res.index < 0) return null;
      app.log = res.records; saveLog();
      return app.log[res.index];
    };

    /* =================================================================
       SHOW THE WORKING (00 §5)
       ================================================================= */
    // steps: [{ title, formula, sub, result, note, source }], or groups of them:
    // [{ heading, group, steps: [...] }]. A group with a predict `group` stays hidden
    // until that group's prediction is checked.
    app.setWorking = steps => { app.working = steps || []; };
    const workingGrouped = () => app.working.some(s => s && Array.isArray(s.steps));
    const groupMasked = gr => gr.group !== undefined ? app.masked(gr.group) : app.masked();
    const stepsHtml = steps => '<ol class="wk">' + steps.map(s =>
      '<li><div class="wt">' + s.title + '</div>' +
      (s.formula ? '<div class="wf">' + s.formula + '</div>' : '') +
      (s.sub ? '<div class="ws">= ' + s.sub + '</div>' : '') +
      (s.result ? '<div class="wr">= ' + s.result + '</div>' : '') +
      (s.note ? '<div class="note">' + s.note + '</div>' : '') +
      (s.source ? '<div class="wsrc">Source: ' + esc(s.source) + '</div>' : '') + '</li>').join('') + '</ol>';
    function renderWorking() {
      const body = app.el.working;
      if (workingGrouped()) {
        if (app.hasInvalid()) { body.innerHTML = '<p class="note" style="padding:8px 10px">' + esc(app.invalidReason()) + '.</p>'; return; }
        body.innerHTML = app.working.map(gr => '<h4 class="wk-h">' + gr.heading + '</h4>' +
          (groupMasked(gr) ? '<p class="note" style="padding:4px 10px 8px">Hidden until you check your prediction.</p>'
            : gr.steps.length ? stepsHtml(gr.steps) : '<p class="note" style="padding:4px 10px 8px">Nothing to show yet.</p>')).join('');
        return;
      }
      if (app.masked()) { body.innerHTML = '<p class="note" style="padding:8px 10px">Hidden until you check your prediction.</p>'; return; }
      if (app.hasInvalid()) { body.innerHTML = '<p class="note" style="padding:8px 10px">' + esc(app.invalidReason()) + '.</p>'; return; }
      if (!app.working.length) { body.innerHTML = '<p class="note" style="padding:8px 10px">Nothing to show yet.</p>'; return; }
      body.innerHTML = stepsHtml(app.working);
    }

    /* =================================================================
       RENDER CYCLE
       ================================================================= */
    let saveT = 0;
    function saveState() { clearTimeout(saveT); saveT = setTimeout(() => S.set('state', { schemaVersion: cfg.schemaVersion, state: cfg.getState ? cfg.getState(app) : app.state }), 250); }
    function saveSettings() { S.set('settings', app.settings); }
    function saveLog() { S.set('log', app.log); }
    function render() {
      syncModes(); syncTabs(); syncChallenge();
      app.fields.forEach(f => f.sync());
      cfg.render(app);
      renderPf();
      renderWorking();
    }
    app.render = render;
    // Call after any input change (00 §4.4: hides results and clears predictions).
    app.changed = (opts) => {
      if (!(opts && opts.keepPrediction) && pfOn()) clearPrediction();
      saveState(); render();
    };
    app.refreshFields = () => { app.fields.forEach(f => f.reset()); };

    /* =================================================================
       SAVE / LOAD / IMPORT (00 §6)
       ================================================================= */
    function context() { if (cfg.context) return cfg.context(app); const c = app.challenge(); return c ? c.id : 'sandbox'; }
    function contextLabel() { if (cfg.contextLabel) return cfg.contextLabel(app); const c = app.challenge(); return c ? 'Challenge ' + c.id : 'Sandbox'; }
    app.fileName = ext => exportName({ student: app.student(), tool: cfg.slug, context: context(), dateISO: localDateISO(), ext });
    $('shSave').addEventListener('click', () => {
      const f = SC.makeDesignFile({ tool: cfg.tool, toolVersion: cfg.version, schemaVersion: cfg.schemaVersion }, cfg.getState ? cfg.getState(app) : app.state);
      f.student = app.student();
      download(app.fileName('json'), JSON.stringify(f, null, 2), 'application/json');
      app.toast('Saved ' + app.fileName('json'));
    });
    $('shLoad').addEventListener('click', () => app.openFile());
    app.openFile = () => { $('shFile').value = ''; $('shFile').click(); };
    $('shFile').addEventListener('change', e => { const fs = e.target.files; if (fs.length) { if (cfg.onFiles) readFiles(fs); else readFile(fs[0]); } });
    document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    document.addEventListener('drop', e => {
      if (!e.dataTransfer || !e.dataTransfer.files.length) return;
      e.preventDefault();
      if (cfg.onFiles) readFiles(e.dataTransfer.files); else readFile(e.dataTransfer.files[0]);
    });
    // cfg.onFiles(app, [{ name, text, error }]): a tool that takes many files at once
    // (the Collector) gets every file except saved design files, which the shell
    // restores as usual. A file that can't be read has text null and an error.
    function readFiles(list) {
      return Promise.all([...list].map(f => new Promise(res => {
        const r = new FileReader();
        r.onload = () => res({ name: f.name, text: String(r.result), error: null });
        r.onerror = () => res({ name: f.name, text: null, error: 'the file could not be read' });
        r.readAsText(f);
      }))).then(files => {
        const rest = files.filter(f => {
          if (f.text !== null && !/\.csv$/i.test(f.name) && SC.kindOf(f.text) === 'design') { app.loadText(f.text, f.name); return false; }
          return true;
        });
        if (rest.length) cfg.onFiles(app, rest);
      });
    }
    app.readFiles = readFiles;
    function readFile(file) {
      const r = new FileReader();
      r.onload = () => app.loadText(String(r.result), file.name);
      r.onerror = () => app.toast('That file could not be read.', 6000);
      r.readAsText(file);
    }
    app.loadText = (text, name) => {
      try {
        const kind = /\.csv$/i.test(name || '') ? 'prediction-log' : SC.kindOf(text);
        if (kind === 'design') {
          const res = SC.readDesignFile(text, { tool: cfg.tool, schemaVersion: cfg.schemaVersion, migrate: cfg.migrate });
          app.state = Object.assign(cfg.defaultState(), res.value.state);
          if (cfg.afterLoad) cfg.afterLoad(app);
          app.invalid = {};
          clearPrediction(); app.refreshFields(); saveState(); render();
          app.toast(res.warnings.length ? res.warnings.join(' ') : 'Loaded ' + (name || 'design') + '.', res.warnings.length ? 8000 : 3500);
          return { ok: true, warnings: res.warnings };

      mBox: 1, s: 0.3, v: 0.3, L: 2, H: 0, mb: 0.5, mu: 0.3, SF: 1.5, eta: 1.0, D: 60,
      Ts: 2, N0: 300, ratioMode: 'solver', ratio: 3.14,
      muP: 0.3, wrap: 180, T2auto: true, T2: 18.7,
      Lb: 100, dShaft: 8, Sy: 400,
      reqs: [], nextReq: 1,
    };
  }

  // Field rules (spec 05 §5, 00 §8), in display units. Motor and shaft ranges follow specs 02 and 01.
  const FIELDS = {
    mBox: { name: 'Box mass', unit: 'kg', min: 0.01, max: 100 },
    s: { name: 'Box spacing', unit: 'm', min: 0.05, max: 10 },
    v: { name: 'Target belt speed', unit: 'm/s', min: 0.01, max: 5 },
    L: { name: 'Bed length', unit: 'm', min: 0.2, max: 20 },
    H: { name: 'Lift', unit: 'm', min: 0, max: 20 },
    mb: { name: 'Belt mass per meter', unit: 'kg/m', min: 0.01, max: 20 },
    mu: { name: 'Bed friction μ', min: 0.01, max: 1 },
    SF: { name: 'Service factor', min: 1, max: 3 },
    eta: { name: 'Drive efficiency η', min: 0.3, max: 1 },
    D: { name: 'Pulley diameter', unit: 'mm', min: 10, max: 1000 },
    Ts: { name: 'Stall torque', unit: 'N·m', min: 0.001, max: 500 },
    N0: { name: 'No-load speed', unit: 'rpm', min: 1, max: 50000 },
    ratio: { name: 'Ratio', min: 0.1, max: 100 },
    muP: { name: 'Pulley friction μp', min: 0.05, max: 1 },
    wrap: { name: 'Wrap angle', unit: '°', min: 90, max: 270 },
    T2: { name: 'Belt tension setting', unit: 'N', gt: 0, max: 100000 },
    Lb: { name: 'Bearing span', unit: 'mm', min: 10, max: 2000 },
    dShaft: { name: 'Shaft diameter', unit: 'mm', min: 1, max: 200 },
    Sy: { name: 'Yield strength', unit: 'MPa', min: 1, max: 2000 },
  };
  // CD-8.
  const liftCheck = (H, L) => H > L ? 'Lift cannot be more than the bed length.' : null;

  /* ------------------------------------------------------------ steps §3.1–3.4 */
  function load(s) {
    const mp = s.mBox / s.s;
    const ratio = s.L / s.s, fl = Math.floor(ratio + 1e-9);
    const divides = Math.abs(ratio - Math.round(ratio)) < 1e-9;
    return { mp, throughput: 60 * s.v / s.s, boxesMax: fl + 1, boxesMin: divides ? fl + 1 : fl, divides };
  }
  function beltPull(s, mp) {
    const fric = s.mu * G * (s.mb + mp) * s.L, lift = mp * G * s.H;
    return { fric, lift, Te: fric + lift, angle: s.L > 0 ? Math.asin(Math.min(1, s.H / s.L)) : 0 };
  }
  function power(s, Te) { const P = Te * s.v; return { P, Pmotor: P * s.SF / s.eta }; }
  function pulley(s, Te) { const D = s.D / 1000; return { D, Tp: Te * D / 2, Np: 60 * s.v / (Math.PI * D) }; }

  /* ------------------------------------------------------------ motor and ratio §3.5 (MotorCore) */
  // o: { Tp (N·m), Np (rpm), Ts (N·m), N0 (rpm), ratioMode, ratio, eta, D (m), vTarget (m/s) }
  function drive(o) {
    const w0 = rad(o.N0), wT = rad(o.Np);
    const solver = MC.solveRatio({ Ts: o.Ts, w0, k: 1, eta: o.eta, TL: o.Tp, wTarget: wT });
    const i = o.ratioMode === 'solver' ? (solver.feasible ? solver.iHigh : null) : o.ratio;
    const out = { solver, i, Pmax: MC.motor({ Ts: o.Ts, w0, k: 1 }).Pmax };
    if (i === null) { out.reason = 'no ratio reaches the target speed with this motor and load'; return out; }
    const op = MC.operate({ Ts: o.Ts, w0, k: 1, i, eta: o.eta, TL: o.Tp, r: o.D / 2 });
    out.op = op;
    out.Nm = rpm(op.wm); out.Nout = rpm(op.wout);
    out.vBelt = op.wout * o.D / 2;                      // v = ω r
    out.speedErr = clean((out.vBelt - o.vTarget) / o.vTarget * 100);
    if (op.stalled) out.reason = 'the motor stalls: the load needs more than its stall torque at this ratio';
    return out;
  }

  /* ------------------------------------------------------------ tensions §3.6 */
  function tensions(s, Te) {
    const theta = s.wrap * DEG, ef = Math.exp(s.muP * theta);
    const T2min = Te / (ef - 1);
    const T2 = s.T2auto ? 1.3 * T2min : s.T2;
    const T1 = Te + T2;
    return { theta, ef, T2min, T2, T1, margin: T2 / T2min, slips: T2 < T2min, TeMax: T2 * (ef - 1) };
  }

  /* ------------------------------------------------------------ side load, shaft, bearings §3.7 */
  // The two spans' directions differ by (180° − θ). The tight span leaves the drive pulley toward the
  // tail (180° on the side view); the slack span turns by the wrap. Their sum gives R and its direction.
  function sideLoad(T1, T2, theta) {
    const R = Math.sqrt(T1 * T1 + T2 * T2 - 2 * T1 * T2 * Math.cos(theta));
    const a2 = 2 * Math.PI - theta;
    const x = T1 * Math.cos(Math.PI) + T2 * Math.cos(a2), y = T1 * Math.sin(Math.PI) + T2 * Math.sin(a2);
    let ang = Math.atan2(y, x) / DEG; if (ang < 0) ang += 360;
    return { R, angleDeg: ang };
  }
  // Centred pulley on a shaft between two bearings, through BeamCore unchanged. The drive torque runs
  // from the coupling at bearing A to the pulley (QUESTIONS Q22 has the direction note).
  function shaft(R, Tp, s) {
    const Lb = s.Lb / 1000;
    const res = BC.analyze({ L: Lb, loads: [{ P: R, a: Lb / 2, label: 'Drive pulley' }], mode: 'shaft', torque: { T: Tp, from: 0, to: Lb / 2 }, d: s.dShaft / 1000, Sy: s.Sy * 1e6, rule: 'tresca' });
    const c = res.critical;
    return { Lb, beam: res, M: c ? c.M : null, T: c ? c.T : null, tauMax: c ? c.tauMax : null, n: res.n, RA: res.RA, RB: res.RB, Mformula: R * Lb / 4 };
  }

  /* ------------------------------------------------------------ the whole design */
  function design(s) {
    const ld = load(s), bp = beltPull(s, ld.mp), pw = power(s, bp.Te), pu = pulley(s, bp.Te);
    const dr = drive({ Tp: pu.Tp, Np: pu.Np, Ts: s.Ts, N0: s.N0, ratioMode: s.ratioMode, ratio: s.ratio, eta: s.eta, D: pu.D, vTarget: s.v });
    const tn = tensions(s, bp.Te);
    const sl = sideLoad(tn.T1, tn.T2, tn.theta);
    const sh = shaft(sl.R, pu.Tp, s);
    const out = {
      load: ld, pull: bp, power: pw, pulley: pu, drive: dr, tensions: tn, side: sl, shaft: sh,
      bearing: sl.R / 2,
      hold: s.H > 0 ? { backward: ld.mp * G * s.H } : null,
      throughputActual: isNum(dr.vBelt) ? 60 * dr.vBelt / s.s : null,
      powerMargin: dr.Pmax / pw.Pmotor,
    };
    out.reqs = requirements(s.reqs || [], s, out);
    return out;
  }

  /* ------------------------------------------------------------ requirements §4 */
  const QUANTITIES = {
    speed: { label: 'Belt speed', unit: 'm/s', cmp: 'within', value: (s, d) => d.drive.vBelt, output: 'loaded belt speed from the chosen ratio' },
    throughput: { label: 'Throughput', unit: 'boxes/min', cmp: 'atLeast', value: (s, d) => d.throughputActual, output: 'boxes per minute at the loaded belt speed' },
    boxMass: { label: 'Box mass capacity', unit: 'kg', cmp: 'atLeast', value: s => s.mBox, output: 'box mass used in T_e' },
    length: { label: 'Length', unit: 'm', cmp: 'atLeast', value: s => s.L, output: 'bed length L' },
    lift: { label: 'Lift', unit: 'm', cmp: 'atLeast', value: s => s.H, output: 'lift H' },
    duty: { label: 'Motor duty', unit: '% of stall', cmp: 'atMost', value: (s, d) => d.drive.op ? d.drive.op.pct : null, output: 'motor torque as a percent of stall' },
    slip: { label: 'Slip margin', unit: '', cmp: 'atLeast', value: (s, d) => d.tensions.margin, output: 'T₂ setting ÷ T₂,min' },
    shaftN: { label: 'Shaft safety factor', unit: '', cmp: 'atLeast', value: (s, d) => d.shaft.n, output: 'n from the shaft check' },
    powerMargin: { label: 'Motor power margin', unit: '', cmp: 'atLeast', value: (s, d) => d.powerMargin, output: 'maximum motor power ÷ motor power needed (QUESTIONS Q19)' },
    custom: { label: 'Custom', unit: '', cmp: 'manual', value: () => null, output: 'checked by the team' },
  };
  const CMPS = { within: 'within ±', atLeast: 'at least', atMost: 'at most', manual: 'checked by hand' };
  function requirements(rows, s, d) {
    return rows.map(r => {
      const q = QUANTITIES[r.qty] || QUANTITIES.custom;
      const cmp = r.qty === 'custom' ? 'manual' : (r.cmp || q.cmp);
      if (cmp === 'manual') return { row: r, q, cmp, value: null, status: 'manual' };
      const value = q.value(s, d);
      if (!isNum(value) || !isNum(r.target)) return { row: r, q, cmp, value: isNum(value) ? value : null, status: 'undefined', reason: isNum(value) ? 'no target' : 'not defined for this design' };
      let pass;
      const diff = r.target !== 0 ? clean((value - r.target) / r.target * 100) : null;
      if (cmp === 'within') pass = diff !== null && Math.abs(diff) <= (isNum(r.tol) ? r.tol : 0) + 1e-9;
      else if (cmp === 'atLeast') pass = value >= r.target - 1e-12;
      else pass = value <= r.target + 1e-12;
      return { row: r, q, cmp, value, diff, status: pass ? 'pass' : 'fail' };
    });
  }
  // The rows in the mockup, as a starting set the team edits.
  function exampleRequirements(startId) {
    const ex = [
      { desc: 'Belt speed', qty: 'speed', cmp: 'within', target: 0.3, tol: 10 },
      { desc: 'Throughput', qty: 'throughput', cmp: 'atLeast', target: 55 },
      { desc: 'Motor runs cool', qty: 'duty', cmp: 'atMost', target: 30 },
      { desc: 'Belt does not slip', qty: 'slip', cmp: 'atLeast', target: 1.2 },
      { desc: 'Pulley shaft is strong enough', qty: 'shaftN', cmp: 'atLeast', target: 2 },
      { desc: 'Guards on both nip points', qty: 'custom', cmp: 'manual', target: null },
    ];
    return ex.map((r, k) => Object.assign({ id: startId + k, tol: null }, r));
  }

  /* ------------------------------------------------------------ predict targets (§7) */
  // One Check per design step (shell groups). Quantity names are fixed in ecosystem/schemas.md.
  function targets(d) {
    return [
      { key: 'Te', group: 'pull', groupLabel: 'Belt pull', quantity: 'belt pull T_e', label: 'Belt pull T<sub>e</sub>', unit: 'N', model: d.pull.Te },
      { key: 'P', group: 'power', groupLabel: 'Power', quantity: 'belt power P', label: 'Belt power P', unit: 'W', model: d.power.P },
      { key: 'Np', group: 'pulley', groupLabel: 'Drive pulley', quantity: 'pulley speed N_p', label: 'Pulley speed N<sub>p</sub>', unit: 'rpm', model: d.pulley.Np },
      { key: 'T2min', group: 'tensions', groupLabel: 'Tensions and slip', quantity: 'minimum slack-side tension T2_min', label: 'T<sub>2,min</sub>', unit: 'N', model: d.tensions.T2min },
      { key: 'R', group: 'shaft', groupLabel: 'Pulley shaft', quantity: 'shaft side load R', label: 'Side load R', unit: 'N', model: d.side.R },
      { key: 'n', group: 'shaft', groupLabel: 'Pulley shaft', quantity: 'shaft safety factor n', label: 'Safety factor n', unit: '', model: d.shaft.n },
    ];
  }

  /* ------------------------------------------------------------ show the working (00 §5), by step */
  function working(d, s, f, fu) {
    const ld = d.load, bp = d.pull, pw = d.power, pu = d.pulley, dr = d.drive, tn = d.tensions, sl = d.side, sh = d.shaft;
    const groups = [];
    const pull = [
      { title: 'Product mass per meter', formula: 'm′_p = m_box / s', sub: fu(s.mBox, 'kg') + ' / ' + fu(s.s, 'm'), result: fu(ld.mp, 'kg/m'), source: SOURCES.pc },
      { title: 'Throughput', formula: '60 v / s', sub: '60 × ' + fu(s.v, 'm/s') + ' / ' + fu(s.s, 'm'), result: fu(ld.throughput, 'boxes/min'), source: SOURCES.pc },
      { title: 'Friction part of the belt pull', formula: 'μ g (m′_b + m′_p) L', sub: f(s.mu) + ' × 9.81 m/s² × (' + fu(s.mb, 'kg/m') + ' + ' + fu(ld.mp, 'kg/m') + ') × ' + fu(s.L, 'm'), result: fu(bp.fric, 'N'), source: SOURCES.pc },
      { title: 'Lift part of the belt pull', formula: 'm′_p g H', sub: fu(ld.mp, 'kg/m') + ' × 9.81 m/s² × ' + fu(s.H, 'm'), result: fu(bp.lift, 'N'), note: s.H > 0 ? 'The friction part uses the full weight, which slightly overestimates friction on an incline: on the safe side.' : '', source: SOURCES.pc },
      { title: 'Belt pull (effective tension)', formula: 'T_e = μ g (m′_b + m′_p) L + m′_p g H', sub: fu(bp.fric, 'N') + ' + ' + fu(bp.lift, 'N'), result: fu(bp.Te, 'N'), note: 'Belt pull does not depend on belt speed.', source: SOURCES.pc },
    ];
    if (d.hold) pull.push({ title: 'Backward pull with the power off', formula: 'm′_p g H', sub: fu(ld.mp, 'kg/m') + ' × 9.81 m/s² × ' + fu(s.H, 'm'), result: fu(d.hold.backward, 'N'), note: 'On an incline the load can drive the belt backward. Check whether the motor and gearbox hold, or add a brake or holding feature.', source: SOURCES.pc });
    groups.push({ heading: 'Load and belt pull', group: 'pull', steps: pull });
    groups.push({ heading: 'Power', group: 'power', steps: [
      { title: 'Belt power', formula: 'P = T_e v', sub: fu(bp.Te, 'N') + ' × ' + fu(s.v, 'm/s'), result: fu(pw.P, 'W'), source: SOURCES.rul },
      { title: 'Motor power needed', formula: 'P × service factor ÷ η', sub: fu(pw.P, 'W') + ' × ' + f(s.SF) + ' ÷ ' + f(s.eta), result: fu(pw.Pmotor, 'W'), source: SOURCES.pc },
    ] });
    groups.push({ heading: 'Drive pulley', group: 'pulley', steps: [
      { title: 'Pulley torque', formula: 'T_p = T_e D / 2', sub: fu(bp.Te, 'N') + ' × ' + fu(s.D, 'mm') + ' / 2', result: fu(pu.Tp, 'N·m'), source: SOURCES.rul },
      { title: 'Pulley speed', formula: 'N_p = 60 v / (π D)', sub: '60 × ' + fu(s.v, 'm/s') + ' / (π × ' + fu(s.D, 'mm') + ')', result: fu(pu.Np, 'rpm'), source: SOURCES.vr },
    ] });
    const mot = [];
    const sv = dr.solver;
    mot.push({ title: 'Ratio for the target speed under load', formula: 'ω_out i² − ω₀ i + ω₀ T_L / (η T_s) = 0', sub: f(sv.a) + ' i² − ' + f(-sv.b) + ' i + ' + f(sv.c) + ' = 0', result: sv.feasible ? 'i = ' + f(sv.iHigh) + (sv.iLow ? ' or ' + f(sv.iLow) : '') : 'no real root', note: sv.feasible ? 'The larger root keeps the motor below half its stall torque.' : 'No ratio reaches the target speed with this motor and load.', source: SOURCES.motor });
    if (dr.op) {
      const op = dr.op;
      mot.push({ title: 'Motor torque at the chosen ratio', formula: 'T_m = T_L / (i η)', sub: fu(pu.Tp, 'N·m') + ' / (' + f(dr.i) + ' × ' + f(s.eta) + ')', result: fu(op.Tm, 'N·m') + ' = ' + fu(op.pct, '% of stall'), note: 'Duty band: ' + op.band + '.', source: SOURCES.motor });
      mot.push({ title: 'Loaded speeds', formula: 'N_m = N₀ (1 − T_m/T_s),  N_out = N_m / i', sub: fu(s.N0, 'rpm') + ' × (1 − ' + f(op.Tm) + ' / ' + f(s.Ts) + '),  ÷ ' + f(dr.i), result: fu(dr.Nm, 'rpm') + ', ' + fu(dr.Nout, 'rpm'), source: SOURCES.motor });
      mot.push({ title: 'Loaded belt speed', formula: 'v = N_out π D / 60', sub: fu(dr.Nout, 'rpm') + ' × π × ' + fu(s.D, 'mm') + ' / 60', result: fu(dr.vBelt, 'm/s') + ' (' + U3pct(dr.speedErr) + ' against ' + fu(s.v, 'm/s') + ')', source: SOURCES.vr });
    }
    mot.push({ title: 'Motor power margin', formula: '(T_s ω₀ / 4) ÷ motor power needed', sub: fu(dr.Pmax, 'W') + ' ÷ ' + fu(pw.Pmotor, 'W'), result: f(d.powerMargin), note: 'Maximum motor power is at half the stall torque (QUESTIONS Q19).', source: SOURCES.motor });
    groups.push({ heading: 'Motor and ratio', group: 'pulley', steps: mot });
    groups.push({ heading: 'Tensions and slip', group: 'tensions', steps: [
      { title: 'Capstan factor', formula: 'e^(μ_p θ)', sub: 'e^(' + f(s.muP) + ' × ' + f(tn.theta) + ' rad)', result: f(tn.ef), note: 'θ in radians: ' + f(s.wrap) + '° = ' + f(tn.theta) + ' rad.', source: SOURCES.wiki },
      { title: 'Minimum slack-side tension', formula: 'T₂,min = T_e / (e^(μ_p θ) − 1)', sub: fu(bp.Te, 'N') + ' / (' + f(tn.ef) + ' − 1)', result: fu(tn.T2min, 'N'), source: SOURCES.bison },
      { title: 'Your belt tension setting', formula: s.T2auto ? 'T₂ = 1.3 × T₂,min' : 'T₂ (set by the team)', sub: s.T2auto ? '1.3 × ' + fu(tn.T2min, 'N') : '', result: fu(tn.T2, 'N'), source: SOURCES.rul },
      { title: 'Tight-side tension', formula: 'T₁ = T_e + T₂', sub: fu(bp.Te, 'N') + ' + ' + fu(tn.T2, 'N'), result: fu(tn.T1, 'N'), source: SOURCES.rul },
      { title: 'Slip margin', formula: 'T₂ / T₂,min', sub: fu(tn.T2, 'N') + ' / ' + fu(tn.T2min, 'N'), result: f(tn.margin), note: tn.slips ? 'Below 1: the belt will slip on the drive pulley.' : '', source: SOURCES.bison },
    ] });
    groups.push({ heading: 'Pulley shaft and bearings', group: 'shaft', steps: [
      { title: 'Side load on the pulley shaft', formula: 'R = √(T₁² + T₂² − 2 T₁ T₂ cos θ)', sub: '√(' + f(tn.T1) + '² + ' + f(tn.T2) + '² − 2 × ' + f(tn.T1) + ' × ' + f(tn.T2) + ' × cos ' + f(s.wrap) + '°)', result: fu(sl.R, 'N'), note: s.wrap === 180 ? 'For θ = 180° this is T₁ + T₂.' : '', source: SOURCES.rul },
      { title: 'Bending moment, pulley centred', formula: 'M = R L_b / 4', sub: fu(sl.R, 'N') + ' × ' + fu(s.Lb, 'mm') + ' / 4', result: fu(sh.Mformula, 'N·m'), source: SOURCES.shaft },
      { title: 'Largest shear stress (Tresca)', formula: 'τ_max = (16 / (π d³)) √(M² + T²)', sub: '16 / (π × (' + fu(s.dShaft, 'mm') + ')³) × √(' + f(sh.M) + '² + ' + f(pu.Tp) + '²)', result: fu(sh.tauMax / 1e6, 'MPa'), source: SOURCES.shaft },
      { title: 'Safety factor', formula: 'n = S_y / (2 τ_max)', sub: fu(s.Sy, 'MPa') + ' / (2 × ' + fu(sh.tauMax / 1e6, 'MPa') + ')', result: f(sh.n), note: 'The yield strength is a placeholder until the team enters a datasheet value.', source: SOURCES.shaft },
      { title: 'Bearing loads', formula: 'R / 2 each', sub: fu(sl.R, 'N') + ' / 2', result: fu(d.bearing, 'N') + ' each', source: SOURCES.shaft },
    ] });
    return groups;
  }
  const U3pct = p => (isNum(p) ? (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p).toFixed(1) + '%' : 'not defined');

  /* ------------------------------------------------------------ files */
  function shaftLoads(d) {
    return { label: 'Drive pulley', magnitude: d.side.R, angleDeg: d.side.angleDeg, torque: d.pulley.Tp };
  }
  function driveRequest(d, s) {
    return {
      loadTorque: d.pulley.Tp, targetSpeed: d.pulley.Np,
      stages: isNum(d.drive.i) ? [{ ratio: d.drive.i, efficiency: s.eta }] : undefined,
      motor: { label: 'Team motor', stallTorque: s.Ts, noLoadSpeed: s.N0, count: 1 },
      note: 'Capstone conveyor drive',
    };
  }
  // A drive-result from the Motor and Drive Matcher: take its motor and overall ratio and efficiency.
  function applyDriveResult(s, res) {
    const v = res.value, notes = [];
    if (v.motor && v.motor.stallTorque > 0 && v.motor.noLoadSpeed > 0) {
      const k = Math.max(1, Math.round(v.motor.count || 1));
      s.Ts = v.motor.stallTorque * k; s.N0 = v.motor.noLoadSpeed;
      if (k > 1) notes.push('The result uses ' + k + ' motors in parallel; the Conveyor Designer models them as one motor with ' + k + ' times the stall torque.');
    }
    s.ratioMode = 'hand'; s.ratio = Number(Number(v.ratio).toPrecision(6));
    if (isNum(v.efficiency)) { const e = Math.min(1, Math.max(0.3, v.efficiency)); if (e !== v.efficiency) notes.push('The drive efficiency was kept within 0.3 to 1.'); s.eta = e; }
    return notes;
  }

  function describe(d, s, fu, masked) {
    let t = 'Side view of a ' + fu(s.L, 'm') + ' slider-bed conveyor' + (s.H > 0 ? ' rising ' + fu(s.H, 'm') : '') + ', boxes of ' + fu(s.mBox, 'kg') + ' every ' + fu(s.s, 'm') + ', drive pulley ' + fu(s.D, 'mm') + ' at the head. ';
    if (!masked) {
      t += 'Belt pull ' + fu(d.pull.Te, 'N') + '. ';
      if (isNum(d.drive.vBelt)) t += 'Loaded belt speed ' + fu(d.drive.vBelt, 'm/s') + '. ';
      t += 'Tight side ' + fu(d.tensions.T1, 'N') + ', slack side ' + fu(d.tensions.T2, 'N') + (d.tensions.slips ? ': the belt will slip. ' : '. ');
      t += 'Side load on the pulley shaft ' + fu(d.side.R, 'N') + '.';
    }
    const failing = d.reqs.filter(r => r.status === 'fail').length;
    if (d.reqs.length) t += ' Requirements: ' + d.reqs.filter(r => r.status === 'pass').length + ' pass, ' + failing + ' fail.';
    return t;
  }

  function snapshot(s) {
    return {
      values: { mBox: s.mBox, s: s.s, v: s.v, L: s.L, H: s.H, mb: s.mb, mu: s.mu, SF: s.SF, eta: s.eta, D: s.D / 1000, Ts: s.Ts, omega0: rad(s.N0), ratio: s.ratioMode === 'solver' ? 'solver' : s.ratio, muP: s.muP, wrap: s.wrap * DEG, T2: s.T2auto ? 'auto' : s.T2, Lb: s.Lb / 1000, d: s.dShaft / 1000, Sy: s.Sy * 1e6 },
      units: { mBox: 'kg', s: 'm', v: 'm/s', L: 'm', H: 'm', mb: 'kg/m', mu: '', SF: '', eta: '', D: 'm', Ts: 'N·m', omega0: 'rad/s', ratio: '', muP: '', wrap: 'rad', T2: 'N', Lb: 'm', d: 'm', Sy: 'Pa' },
